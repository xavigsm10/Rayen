[versions]
agp = "8.12.3"
kotlin = "2.4.10"
coreKtx = "1.16.0"
lifecycleRuntimeKtx = "2.9.1"
activityCompose = "1.10.1"
composeBom = "2024.09.00"
vanniktechPublishing = "0.35.0"
media3 = "1.5.1"
cloudy = "0.5.0"
